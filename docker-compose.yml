services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kt
      POSTGRES_PASSWORD: kt
      POSTGRES_DB: kt_wrapper
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kt -d kt_wrapper"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://kt:kt@postgres:5432/kt_wrapper
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
